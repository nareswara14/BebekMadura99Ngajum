name: Build APK BEBEK MADURA 99 NGAJUM

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Find unsigned APK
        run: |
          echo "Mencari APK hasil build..."
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Prepare Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -1

      - name: Sign Release APK
        run: |
          set -e

          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          UNSIGNED=$(find app/build/outputs/apk -type f -name "*unsigned.apk" | head -1)
          if [ -z "$UNSIGNED" ]; then
            UNSIGNED=$(find app/build/outputs/apk -type f -name "*.apk" | head -1)
          fi

          echo "APK sumber: $UNSIGNED"
          test -n "$UNSIGNED"

          mkdir -p release

          keytool -genkeypair \
            -v \
            -keystore release/bebek-madura-release.jks \
            -alias bebekmadura99 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass BebekMadura99@2026 \
            -keypass BebekMadura99@2026 \
            -dname "CN=BEBEK MADURA 99 NGAJUM, OU=Pengelola, O=BEBEK MADURA 99 NGAJUM, L=Ngajum, ST=Jawa Timur, C=ID"

          "$ZIPALIGN" -f 4 "$UNSIGNED" release/app-release-unsigned-aligned.apk

          "$APKSIGNER" sign \
            --ks release/bebek-madura-release.jks \
            --ks-key-alias bebekmadura99 \
            --ks-pass pass:BebekMadura99@2026 \
            --key-pass pass:BebekMadura99@2026 \
            --out release/app-release.apk \
            release/app-release-unsigned-aligned.apk

          "$APKSIGNER" verify --verbose release/app-release.apk

          echo "======================================"
          echo "APK BERHASIL DIBUAT"
          echo "======================================"
          ls -lh release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BEBEK-MADURA-99-NGAJUM-APK
          path: release/app-release.apk
          if-no-files-found: error
